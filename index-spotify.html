<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pauls Soundsystem-Bingo (Spotify-Steuerung)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="spotify-extra.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="app">

  <header class="top">
    <h1>Pauls Soundsystem-Bingo</h1>
    <div class="status-line">
      <div class="stat-badge">
        <span class="stat-label">Runde</span>
        <span class="stat-value" id="round-label">–</span>
      </div>
      <div class="stat-badge">
        <span class="stat-label">Erraten</span>
        <span class="stat-value" id="progress-label">0/0</span>
      </div>
    </div>
  </header>

  <div id="start-overlay" class="finish-overlay show">
    <div class="finish-text" style="font-size:clamp(24px,5vw,40px);">Bereit für die Playlist?</div>

    <div id="start-connect">
      <p class="start-hint">Zuerst mit Spotify verbinden (Premium-Account nötig).</p>
      <button id="connect-btn" class="btn">Mit Spotify verbinden</button>
    </div>

    <div id="start-play" style="display:none;">
      <p class="start-hint">Wiedergabegerät wählen:</p>
      <select id="device-select" class="device-select"></select>
      <div class="start-actions">
        <button id="refresh-devices-btn" class="btn ghost">Geräte aktualisieren</button>
        <button id="start-btn" class="btn">Start</button>
      </div>
    </div>

    <p id="start-status" class="start-status"></p>
  </div>

  <div id="finish-overlay" class="finish-overlay">
    <div class="finish-text">Happy Birthday, Paul!</div>
    <button id="finish-reset-btn" class="btn">Neues Spiel starten</button>
  </div>

  <div class="stage">
    <div class="col pool-col">
      <p class="pool-col-label">🎵 Songs &amp; Interpreten</p>
      <div id="song-pool" class="pool-list"></div>
    </div>

    <div class="col tracks-col">
      <div id="tracks" class="tracks"></div>
    </div>

    <div class="col pool-col">
      <p class="pool-col-label">👤 Gäste</p>
      <div id="guest-pool" class="pool-list"></div>
    </div>
  </div>

  <footer class="controls">
    <button id="reset-btn" class="btn ghost">Spiel zurücksetzen</button>
    <div id="log" class="log"></div>
    <div style="display:flex; gap:10px;">
      <button id="pause-btn" class="btn ghost" disabled>⏸ Pause</button>
      <button id="skip-btn" class="btn">Überspringen</button>
    </div>
  </footer>

</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="data-spotify.js"></script>
<script src="audio.js"></script>
<script src="spotify.js"></script>
<script src="app-spotify.js"></script>
</body>
</html>
