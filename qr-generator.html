<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR-Code erzeugen</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');
:root{
  --bg-page:#12301E; --deep-green:#163220; --gold:#C9A24B; --gold-bright:#EFC968;
  --sage-2:#C3D2B9; --cream:#FBF7EC;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg-page); color:var(--cream);
  font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center;
}
.wrap{ max-width:420px; width:100%; padding:28px; text-align:center; }
h1{ font-family:'Fraunces',serif; color:var(--gold-bright); font-size:24px; margin-bottom:6px;}
p{ font-size:13px; color:var(--sage-2); margin-top:0; }
input{
  width:100%; padding:11px 14px; border-radius:10px; border:2px solid var(--sage-2);
  font-size:14px; margin-bottom:14px; font-family:'Inter',sans-serif;
}
button{
  font-family:'Inter',sans-serif; font-weight:600; border-radius:999px; border:2px solid var(--gold);
  background:transparent; color:var(--gold-bright); padding:10px 22px; cursor:pointer; font-size:14px;
}
button:hover{ background:var(--gold); color:var(--deep-green); }
#qr-canvas-wrap{
  background:white; border-radius:16px; padding:20px; margin-top:20px; display:inline-block;
}
#qr-canvas-wrap:empty{ display:none; }
.hint{ font-size:11.5px; color:var(--sage-2); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎈 QR-Code für die Bingokarte</h1>
  <p>Trage hier die fertige GitHub-Pages-URL zu <code>karte.html</code> ein (z. B. https://deinname.github.io/party-bingo/karte.html).</p>
  <input id="url-input" type="text" placeholder="https://deinname.github.io/party-bingo/karte.html">
  <button id="generate-btn">QR-Code erzeugen</button>
  <div id="qr-canvas-wrap"></div>
  <p class="hint">Der QR-Code wird komplett im Browser erzeugt (kein Datenversand an Dritte). Rechtsklick → „Bild speichern unter…“ zum Ausdrucken.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
document.getElementById('generate-btn').addEventListener('click', async () => {
  const url = document.getElementById('url-input').value.trim();
  const wrap = document.getElementById('qr-canvas-wrap');
  wrap.innerHTML = '';
  if(!url) return;
  const canvas = document.createElement('canvas');
  wrap.appendChild(canvas);
  try{
    await QRCode.toCanvas(canvas, url, { width: 260, margin: 1, color: { dark: '#163220', light: '#FFFFFF' } });
  }catch(e){
    wrap.textContent = 'QR-Code konnte nicht erzeugt werden: ' + e.message;
  }
});
</script>
</body>
</html>
